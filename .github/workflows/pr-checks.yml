# Version active : 2 jobs regroupes par type de verification (check / build),
# chacun en matrix (une execution parallele par service).
jobs:
  check-syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-api, pendu-api, puissance4-api, memory-api, quiz-api, score-api]
    steps:
      - uses: actions/checkout@v4
      - name: Verifie la syntaxe (Python ou Node selon le service)
        run: |
          if [ -f "services/${{ matrix.service }}/app.py" ]; then
            python3 -m py_compile services/${{ matrix.service }}/app.py
          else
            node --check services/${{ matrix.service }}/server.js
          fi

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-api, pendu-api, puissance4-api, memory-api, quiz-api, score-api, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gamecloud/${{ matrix.service }}:pr-check services/${{ matrix.service }}
