name: PR checks

# Verifications lancees sur toute Pull Request vers develop, release/* ou main.
# But: c'est CE check ("pr-checks-summary") qui est exige par la protection
# de branche avant qu'un merge soit possible (voir GUIDE.md / GITFLOW.md).

on:
  pull_request:
    branches: [develop, "release/**", main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-api: 'services/auth-api/**'
            pendu-api: 'services/pendu-api/**'
            quiz-api: 'services/quiz-api/**'
            puissance4-api: 'services/puissance4-api/**'
            memory-api: 'services/memory-api/**'
            score-api: 'services/score-api/**'
            frontend: 'services/frontend/**'

  lint-and-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (Node)
        if: contains(fromJson('["memory-api","quiz-api","score-api"]'), matrix.service)
        run: node --check services/${{ matrix.service }}/server.js

      - name: Syntax check (Python)
        if: contains(fromJson('["auth-api","pendu-api","puissance4-api"]'), matrix.service)
        run: python3 -m py_compile services/${{ matrix.service }}/app.py

      - name: Docker build (verification uniquement, pas de push)
        run: docker build -t gamecloud/${{ matrix.service }}:pr-check services/${{ matrix.service }}

  pr-checks-summary:
    needs: [detect-changes, lint-and-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verifie qu'aucun check n'a echoue
        run: |
          if [ "${{ needs.lint-and-build.result }}" = "failure" ]; then
            echo "Au moins un service a echoue lint-and-build"
            exit 1
          fi
          echo "Tous les checks sont OK (ou aucun service applicatif touche)"
