name: CD - production (tag v*)

# Se declenche quand un tag vX.Y.Z est pousse sur main : c'est le vrai
# passage en production. En conditions reelles, ArgoCD Image Updater gere
# deja le rollout progressif (voir GUIDE.md phase 4) ; ce job documente le
# reste de la chaine (build+scan+push existe deja dans ci.yml sur push main).
#
# NOTE: infra eteinte entre sessions pour maitriser le cout -> deploiement
# simule ici (voir cd-staging.yml pour le meme choix).

on:
  push:
    tags: ["v*.*.*"]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploiement vers Production (Blue/Green via ArgoCD)
        run: |
          echo "Tag de production detecte: ${{ github.ref_name }} (commit ${{ github.sha }})"
          echo ""
          echo "En conditions reelles (cluster EKS + ArgoCD actifs) :"
          echo "  argocd app set gamecloud-prod --revision main --helm-set image.tag=${{ github.sha }}"
          echo "  argocd app sync gamecloud-prod"
          echo "  # rollout progressif gere par ArgoCD (readiness probes) = equivalent Blue/Green"
          echo ""
          echo "Infra actuellement eteinte (cout maitrise) -> etape simulee, non executee."
          echo "Surveillance prevue post-deploiement: Prometheus/Grafana + ELK (phase 7)."
