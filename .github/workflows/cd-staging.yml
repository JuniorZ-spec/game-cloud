name: CD - staging (release/*)

# Se declenche quand une branche release/* est creee/poussee : c'est le
# signal que le contenu de develop est gele pour la version en cours et
# doit partir en recette/staging pour validation QA.
#
# NOTE: l'infra AWS (EKS/ArgoCD) de ce projet est detruite entre les
# sessions pour maitriser le cout (~26$ de budget, voir docs/aws-platform/
# GUIDE.md). Le deploiement reel se fait via ArgoCD/Helm quand le cluster
# est up; ici le job documente exactement les commandes qui seraient
# executees, pour que le pipeline reste lisible meme infra eteinte.

on:
  push:
    branches: ["release/**"]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploiement vers Staging
        run: |
          echo "Release detectee: ${{ github.ref_name }} (commit ${{ github.sha }})"
          echo ""
          echo "En conditions reelles (cluster EKS + ArgoCD actifs) :"
          echo "  argocd app set gamecloud-staging --revision ${{ github.ref_name }}"
          echo "  argocd app sync gamecloud-staging"
          echo ""
          echo "Infra actuellement eteinte (cout maitrise) -> etape simulee, non executee."
