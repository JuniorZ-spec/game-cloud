apiVersion: v1
kind: Namespace
metadata:
  name: gamecloud
---
apiVersion: v1
kind: Secret
metadata:
  name: gamecloud-secrets
  namespace: gamecloud
type: Opaque
stringData:
  # Valeurs de dev local uniquement (cluster Kind ephemere) - a changer
  # pour tout usage reel. Ne jamais committer de vrais secrets ici.
  POSTGRES_DB: gamecloud
  POSTGRES_USER: gameuser
  POSTGRES_PASSWORD: local-dev-only-changeme
  JWT_SECRET: local-dev-only-changeme
