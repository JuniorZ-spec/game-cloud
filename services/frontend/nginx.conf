resolver kube-dns.kube-system.svc.cluster.local valid=5s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/auth/ {
    set $upstream http://auth-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/pendu/ {
    set $upstream http://pendu-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/quiz/ {
    set $upstream http://quiz-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/p4/ {
    set $upstream http://p4-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/memory/ {
    set $upstream http://memory-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /api/scores/ {
    set $upstream http://score-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location /socket.io/ {
    set $upstream http://quiz-service.gamecloud.svc.cluster.local;
    proxy_pass $upstream/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}