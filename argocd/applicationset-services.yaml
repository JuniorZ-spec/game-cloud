# Un seul chart Helm generique + cette liste = toute la plateforme.
# Ajouter un nouveau service (ou une toute autre app) = une ligne ici
# + un fichier values-<service>.yaml. Rien d autre a dupliquer.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gamecloud-services
  namespace: argocd
spec:
  # Sans cette exception, l ApplicationSet re-ecraserait a chaque
  # reconciliation l override de tag pose par l Image Updater (qui
  # ne touche pas Git dans cette variante, seulement l Application
  # elle-meme via l API Kubernetes).
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters
  generators:
    - list:
        elements:
          - service: auth-api
          - service: pendu-api
          - service: quiz-api
          - service: puissance4-api
          - service: memory-api
          - service: score-api
          - service: frontend
  template:
    metadata:
      name: "{{service}}"
      namespace: argocd
      annotations:
        # Surveille le depot ECR du service. Write-back "argocd" (pas
        # de token GitHub necessaire) : le nouveau tag est ecrit comme
        # override sur l Application elle-meme (via l API Kubernetes,
        # config.applicationsAPIKind=kubernetes), pas dans le fichier
        # Git. Compromis assume : deploiement toujours 100% automatique,
        # mais le tag exact deploye n est plus visible dans values-*.yaml.
        argocd-image-updater.argoproj.io/image-list: "{{service}}=915993062361.dkr.ecr.eu-west-3.amazonaws.com/gamecloud/{{service}}"
        argocd-image-updater.argoproj.io/{{service}}.update-strategy: latest
        argocd-image-updater.argoproj.io/{{service}}.helm.image-tag: image.tag
        argocd-image-updater.argoproj.io/{{service}}.pull-secret: "pullsecret:argocd/ecr-creds"
        argocd-image-updater.argoproj.io/write-back-method: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/JuniorZ-spec/game-cloud.git
        targetRevision: main
        path: deploy/helm/game-service
        helm:
          valueFiles:
            - "values/values-{{service}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: gamecloud
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
