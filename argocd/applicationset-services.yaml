# Un seul chart Helm generique + cette liste = toute la plateforme.
# Ajouter un nouveau service (ou une toute autre app) = une ligne ici
# + un fichier values-<service>.yaml. Rien d autre a dupliquer.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gamecloud-services
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: auth-api
          - service: pendu-api
          - service: quiz-api
          - service: puissance4-api
          - service: memory-api
          - service: score-api
          - service: frontend
  template:
    metadata:
      name: "{{service}}"
      namespace: argocd
      annotations:
        # Surveille le depot ECR du service, ecrit le nouveau tag
        # directement dans values/values-<service>.yaml sur Git
        # (Git reste la source de verite, ArgoCD re-sync ensuite).
        argocd-image-updater.argoproj.io/image-list: "{{service}}=915993062361.dkr.ecr.eu-west-3.amazonaws.com/gamecloud/{{service}}"
        argocd-image-updater.argoproj.io/{{service}}.update-strategy: latest
        argocd-image-updater.argoproj.io/{{service}}.helm.image-tag: image.tag
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/write-back-target: "helmvalues:./values/values-{{service}}.yaml"
        argocd-image-updater.argoproj.io/git-branch: main
    spec:
      project: default
      source:
        repoURL: https://github.com/JuniorZ-spec/game-cloud.git
        targetRevision: main
        path: deploy/helm/game-service
        helm:
          valueFiles:
            - "values/values-{{service}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: gamecloud
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
