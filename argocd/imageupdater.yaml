# Nouvelle architecture d ArgoCD Image Updater (v1.3.0+) : une CRD
# ImageUpdater dedicace, plus de simples annotations lues globalement.
# useAnnotations: true reutilise les annotations deja posees sur
# l ApplicationSet (image-list, update-strategy, write-back-method...)
# plutot que de tout redefinir ici.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: gamecloud-image-updater
  namespace: argocd
spec:
  # v1.3.0 n a plus de mecanisme de script externe pour l auth registre
  # (contrairement aux versions plus anciennes) : seul un pullSecret
  # (Secret Kubernetes type docker-registry) est supporte. Genere une
  # seule fois via `aws ecr get-login-password` (valide ~12h) - dans un
  # vrai contexte production, un CronJob le rafraichirait periodiquement.
  commonUpdateSettings:
    pullSecret: "argocd/ecr-creds"
  applicationRefs:
    - namePattern: "*"
      useAnnotations: true
