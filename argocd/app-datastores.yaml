apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamecloud-datastores
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JuniorZ-spec/game-cloud.git
    targetRevision: main
    path: deploy/kustomize/base
  destination:
    server: https://kubernetes.default.svc
    namespace: gamecloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
