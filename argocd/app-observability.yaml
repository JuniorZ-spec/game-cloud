apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamecloud-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JuniorZ-spec/game-cloud.git
    targetRevision: main
    path: observability/eck
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
