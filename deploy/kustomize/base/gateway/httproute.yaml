# Remplace l ancien Ingress nginx (k8s/ingress/ingress.yaml). Meme
# schema de routage par chemin. Gateway API route toujours vers le
# prefixe le plus specifique en premier (contrairement a nginx, l ordre
# des regles ci-dessous n a pas d importance pour la precedence).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gamecloud-routes
  namespace: gamecloud
spec:
  parentRefs:
    - name: gamecloud-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/auth }
      backendRefs:
        - name: auth-api
          port: 5001
    - matches:
        - path: { type: PathPrefix, value: /api/pendu }
      backendRefs:
        - name: pendu-api
          port: 5002
    - matches:
        - path: { type: PathPrefix, value: /api/quiz }
      backendRefs:
        - name: quiz-api
          port: 3001
    - matches:
        - path: { type: PathPrefix, value: /api/p4 }
      backendRefs:
        - name: puissance4-api
          port: 5003
    - matches:
        - path: { type: PathPrefix, value: /api/memory }
      backendRefs:
        - name: memory-api
          port: 3002
    - matches:
        - path: { type: PathPrefix, value: /api/scores }
      backendRefs:
        - name: score-api
          port: 3003
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend
          port: 80
