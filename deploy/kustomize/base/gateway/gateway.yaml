# Le Gateway declenche la creation reelle d un ALB par le controller.
# scheme=internet-facing : accessible depuis Internet (pas de domaine,
# donc pas de TLS/ACM - HTTP simple via le nom DNS auto-genere par AWS).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gamecloud-gateway
  namespace: gamecloud
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  gatewayClassName: alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
